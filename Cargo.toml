[package]
name = "devtrack"
version = "0.1.15"
edition = "2021"
rust-version = "1.87"
resolver = "3"
description = "DevTrack: personal time tracking, read-only work-item import and timesheet preparation"
license = "MIT"

# The shared core (data model, time rules, reports, sync, integrations) is a library
# with no UI dependency, so desktop, web and mobile shells can reuse it.
[lib]
name = "devtrack_core"
path = "src/lib.rs"

[[bin]]
name = "devtrack"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
ureq = { version = "2.12", features = ["json"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
ring = "0.17"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
# the menu bar item talks to AppKit directly; same objc2 that winit already builds
objc2 = "0.5"

# Windows only: puts the app icon (and name and version) inside DevTrack.exe, so Explorer, the
# desktop and shortcuts show it; see build.rs
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
